<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <pattern id="rollink-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>
    </pattern>
    <linearGradient id="brand-grad-rollink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FC9C44" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#FC9C44" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="#0F172A"/>
  <rect width="1200" height="675" fill="url(#rollink-grid)"/>

  <circle cx="600" cy="290" r="320" fill="url(#brand-grad-rollink)"/>
  <circle cx="600" cy="290" r="250" fill="none" stroke="rgba(252, 156, 68, 0.15)" stroke-width="1.5" stroke-dasharray="6 6"/>

  <text x="600" y="175" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="24" fill="#FC9C44" font-weight="700" letter-spacing="5" text-anchor="middle">ORGANIC SEARCH ARCHITECTURE</text>
  <text x="600" y="270" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="82" fill="#FFFFFF" font-weight="800" letter-spacing="2.5" text-anchor="middle">ROLLINK</text>
  <text x="600" y="340" font-family="'Inter', -apple-system, sans-serif" font-size="28" fill="#F1F5F9" font-weight="600" text-anchor="middle">Global Organic Demand &amp; Category Domination</text>

  <g transform="translate(340, 395)">
    <rect x="0" y="0" width="240" height="48" rx="24" fill="#1E293B" stroke="rgba(252, 156, 68, 0.45)" stroke-width="1.5"/>
    <text x="120" y="30" font-family="'Space Grotesk', sans-serif" font-size="18" fill="#FC9C44" font-weight="700" text-anchor="middle">3.5× TRAFFIC</text>

    <rect x="280" y="0" width="240" height="48" rx="24" fill="#1E293B" stroke="rgba(255, 255, 255, 0.18)" stroke-width="1.5"/>
    <text x="400" y="30" font-family="'Space Grotesk', sans-serif" font-size="18" fill="#FFFFFF" font-weight="700" text-anchor="middle">GLOBAL SEARCH</text>
  </g>
</svg>
